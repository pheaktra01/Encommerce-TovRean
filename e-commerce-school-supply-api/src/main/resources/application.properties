server.port=8080
spring.web.cors.allowed-origins=https://tovrean.loengpheaktra.xyz
spring.mongodb.uri==${MONGO_URI}

# JWT Configuration
# Secret key for JWT signing (should be at least 256 bits for HS256)
# In production, use environment variables or secure secret management
app.jwt.secret=${JWT_SECRET}
# Token expiration time in milliseconds (86400000 = 24 hours, 3600000 = 1 hour)
app.jwt.exp=86400000