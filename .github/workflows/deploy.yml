name: Deploy

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Build backend
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
      run: |
        cd e-commerce-school-supply-api
        mvn clean package -DskipTests

    - name: Build frontend
      run: |
        cd e-commerce-school-supply-web
        npm install
        npm run build

    - name: Deploy to server EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        script: |
          if [ ! -d "ecommerce-app/.git" ]; then
            rm -rf ecommerce-app
            git clone git@github.com:pheaktra01/Encommerce-TovRean.git ecommerce-app
          fi

          cd ecommerce-app
          git pull origin master

          docker compose up -d --build