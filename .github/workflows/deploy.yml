name: Deploy

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to server EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        script: |
          # 1. Target the correct initialized folder path
          cd /home/ubuntu/ecommerce-app
          
          # 2. Pull latest updates from master
          git pull origin master
          
          # 3. Export environment variables and spin up containers
          export MONGO_URI='${{ secrets.MONGO_URI }}'
          export JWT_SECRET='${{ secrets.JWT_SECRET }}'
          docker compose up -d --build