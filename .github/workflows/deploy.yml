name: Deploy

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to server EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        script: |
          # 1. Navigate to your repository root on EC2
          cd ecommerce
          
          # 2. Pull the latest code changes
          git pull origin master
          
          # 3. Rebuild and restart the containers with updated env variables
          export MONGO_URI='${{ secrets.MONGO_URI }}'
          export JWT_SECRET='${{ secrets.JWT_SECRET }}'
          docker compose up -d --build