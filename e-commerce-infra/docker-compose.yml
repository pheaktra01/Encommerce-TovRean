services:
  backend:
    build: ../e-commerce-school-supply-api/
    environment:
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    volume:
      - ./uploads:/app/uploads
    restart: always

  frontend:
    build: ../e-commerce-school-supply-web/
    ports:
      - "3000:80"
    restart: always